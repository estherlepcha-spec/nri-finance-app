<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bg" cx="38%" cy="40%" r="70%" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#2a1a00"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <linearGradient id="og" x1="8" y1="12" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffcc44"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <linearGradient id="bg2" x1="56" y1="16" x2="24" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e4fc2"/>
      <stop offset="100%" stop-color="#3a6fd8"/>
    </linearGradient>
    <radialGradient id="gg" cx="42%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#4dd8e8"/>
      <stop offset="100%" stop-color="#0c3d5a"/>
    </radialGradient>
    <filter id="og2"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="bg3"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Orange glow -->
  <ellipse cx="23" cy="30" rx="16" ry="15" fill="#ff7700" opacity="0.2" filter="url(#og2)"/>
  <!-- Blue glow -->
  <ellipse cx="41" cy="33" rx="13" ry="12" fill="#2255cc" opacity="0.25" filter="url(#bg3)"/>

  <!-- Orange arrow (top, curves right) -->
  <path d="M 18 20 C 18 16, 24 13, 32 13 C 40 13, 47 18, 47 26"
        stroke="url(#og)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <polygon points="44,15 52,17 46,23" fill="#ffaa22"/>

  <!-- Blue arrow (bottom, curves left) -->
  <path d="M 46 44 C 46 48, 40 51, 32 51 C 24 51, 17 46, 17 38"
        stroke="url(#bg2)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <polygon points="20,49 12,47 18,41" fill="#2255bb"/>

  <!-- Globe -->
  <circle cx="32" cy="32" r="11" fill="url(#gg)" opacity="0.95"/>
  <circle cx="32" cy="32" r="11" stroke="#7af0ff" stroke-width="0.8" fill="none" opacity="0.6"/>
  <line x1="21" y1="32" x2="43" y2="32" stroke="#aaf5ff" stroke-width="0.8" opacity="0.55"/>
  <ellipse cx="32" cy="32" rx="5.5" ry="11" stroke="#aaf5ff" stroke-width="0.8" fill="none" opacity="0.55"/>
  <circle cx="32" cy="21" r="2" fill="white" opacity="0.85"/>
  <circle cx="43" cy="30" r="1.5" fill="#7af0ff" opacity="0.8"/>
  <circle cx="32" cy="43" r="2" fill="white" opacity="0.8"/>
  <circle cx="21" cy="32" r="1.5" fill="#7af0ff" opacity="0.8"/>
  <circle cx="32" cy="32" r="2" fill="white" opacity="0.9"/>
</svg>
