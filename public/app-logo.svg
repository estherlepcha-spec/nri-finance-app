<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background radial gradient -->
    <radialGradient id="bgGrad" cx="38%" cy="42%" r="65%" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#2a1a00"/>
      <stop offset="45%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <!-- Orange arrow gradient -->
    <linearGradient id="orangeGrad" x1="80" y1="100" x2="320" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffcc44"/>
      <stop offset="50%" stop-color="#ff8800"/>
      <stop offset="100%" stop-color="#cc5500"/>
    </linearGradient>
    <!-- Blue arrow gradient -->
    <linearGradient id="blueGrad" x1="430" y1="130" x2="180" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a3a7a"/>
      <stop offset="50%" stop-color="#1e4fc2"/>
      <stop offset="100%" stop-color="#3a6fd8"/>
    </linearGradient>
    <!-- Globe fill gradient -->
    <radialGradient id="globeGrad" cx="45%" cy="38%" r="62%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#4dd8e8"/>
      <stop offset="40%" stop-color="#1a8fa8"/>
      <stop offset="100%" stop-color="#0c3d5a"/>
    </radialGradient>
    <!-- Orange glow filter -->
    <filter id="orangeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Blue glow filter -->
    <filter id="blueGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Globe glow -->
    <filter id="globeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Soft inner shadow for depth -->
    <filter id="innerShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset dx="4" dy="6" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>

  <!-- Orange ambient glow blob -->
  <ellipse cx="185" cy="240" rx="130" ry="120" fill="#ff7700" opacity="0.18" filter="url(#orangeGlow)"/>

  <!-- Blue ambient glow blob -->
  <ellipse cx="330" cy="265" rx="110" ry="100" fill="#2255cc" opacity="0.22" filter="url(#blueGlow)"/>

  <!-- ===== ORANGE ARROW (top-left, curving right then down) ===== -->
  <!-- Arrow body: thick rounded path curving from left/top around top-right -->
  <path d="M 148 165
           C 148 130, 190 105, 240 105
           C 310 105, 368 148, 368 210"
        stroke="url(#orangeGrad)" stroke-width="28" stroke-linecap="round" fill="none"
        filter="url(#orangeGlow)" opacity="0.95"/>
  <!-- Orange arrowhead pointing right at top -->
  <polygon points="355,118 410,130 365,170" fill="#ffaa22" opacity="0.95" filter="url(#orangeGlow)"/>

  <!-- ===== BLUE ARROW (bottom-right, curving left then up) ===== -->
  <!-- Arrow body: thick rounded path curving from right/bottom around bottom-left -->
  <path d="M 364 347
           C 364 382, 322 407, 272 407
           C 202 407, 144 364, 144 302"
        stroke="url(#blueGrad)" stroke-width="28" stroke-linecap="round" fill="none"
        filter="url(#blueGlow)" opacity="0.95"/>
  <!-- Blue arrowhead pointing left at bottom -->
  <polygon points="157,394 102,382 147,342" fill="#2255bb" opacity="0.95" filter="url(#blueGlow)"/>

  <!-- ===== GLOBE ===== -->
  <!-- Globe outer circle with fill -->
  <circle cx="256" cy="256" r="88" fill="url(#globeGrad)" filter="url(#globeGlow)" opacity="0.95"/>
  <!-- Globe outline -->
  <circle cx="256" cy="256" r="88" stroke="#7af0ff" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Globe grid lines - latitude lines -->
  <line x1="168" y1="256" x2="344" y2="256" stroke="#aaf5ff" stroke-width="1.2" opacity="0.55"/>
  <path d="M 175 218 Q 256 230 337 218" stroke="#aaf5ff" stroke-width="1.0" fill="none" opacity="0.4"/>
  <path d="M 175 294 Q 256 282 337 294" stroke="#aaf5ff" stroke-width="1.0" fill="none" opacity="0.4"/>
  <path d="M 185 182 Q 256 202 327 182" stroke="#aaf5ff" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M 185 330 Q 256 310 327 330" stroke="#aaf5ff" stroke-width="0.8" fill="none" opacity="0.3"/>

  <!-- Globe grid lines - longitude ellipses -->
  <ellipse cx="256" cy="256" rx="44" ry="88" stroke="#aaf5ff" stroke-width="1.2" fill="none" opacity="0.55"/>
  <ellipse cx="256" cy="256" rx="72" ry="88" stroke="#aaf5ff" stroke-width="0.8" fill="none" opacity="0.35"/>

  <!-- Globe network nodes (glowing dots at intersections) -->
  <circle cx="256" cy="168" r="5" fill="#ffffff" opacity="0.9" filter="url(#globeGlow)"/>
  <circle cx="312" cy="188" r="4" fill="#aaf5ff" opacity="0.85"/>
  <circle cx="336" cy="240" r="4.5" fill="#7af0ff" opacity="0.85"/>
  <circle cx="312" cy="296" r="4" fill="#aaf5ff" opacity="0.8"/>
  <circle cx="256" cy="344" r="5" fill="#ffffff" opacity="0.85"/>
  <circle cx="200" cy="320" r="4" fill="#aaf5ff" opacity="0.8"/>
  <circle cx="176" cy="256" r="4.5" fill="#7af0ff" opacity="0.85"/>
  <circle cx="200" cy="196" r="4" fill="#aaf5ff" opacity="0.8"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff" opacity="0.95"/>

  <!-- Globe shine highlight -->
  <ellipse cx="228" cy="222" rx="22" ry="16" fill="white" opacity="0.09"/>
</svg>
